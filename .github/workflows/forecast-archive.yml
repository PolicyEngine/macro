name: Forecast archive

# The forecast track record is only evidence if a round provably existed before
# its outturn did. Everything under forecasts/rounds/ is therefore append-only:
# rounds may be added, never edited or deleted. Enforced here rather than by
# convention, because a silent rewrite is exactly the failure that would destroy
# the claim — and it would look like a routine refresh in review.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  immutability:
    name: Archived rounds are append-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base commit to diff against, so no shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reject edits and deletions under forecasts/rounds/
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --diff-filter=MDR: Modified, Deleted, Renamed. Added (A) is the only
          # legitimate change to an archived round.
          touched=$(git diff --name-only --diff-filter=MDR "$BASE" "$HEAD" -- forecasts/rounds/ || true)
          if [ -n "$touched" ]; then
            echo "::error::archived forecast rounds were modified, renamed or deleted:"
            echo "$touched" | sed 's/^/  /'
            echo ""
            echo "Rounds are append-only. To correct a forecast, archive a new"
            echo "round — the superseded one stays in the history."
            exit 1
          fi
          echo "OK — no archived round was edited."

      - name: Validate the archive
        run: python3 forecasts/archive.py --check

      - name: Reject edits and deletions under data/vintages/
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          touched=$(git diff --name-only --diff-filter=MDR "$BASE" "$HEAD" -- data/vintages/ || true)
          if [ -n "$touched" ]; then
            echo "::error::stored data vintages were modified, renamed or deleted:"
            echo "$touched" | sed 's/^/  /'
            echo ""
            echo "Data vintages are append-only. Store a new dated snapshot"
            echo "instead of rewriting the data previously available."
            exit 1
          fi
          echo "OK — no stored data vintage was edited."

      - name: Data vintage store is consistent
        run: python3 data/fetch.py --check

      - name: Test outturn ingestion
        run: python3 -m unittest discover -s forecasts/tests -p 'test_*.py'

      - name: No outturn is available but unrecorded
        run: python3 forecasts/ingest_outturns.py --check

      - name: Scorecard and page are current
        run: python3 forecasts/score.py --check

      - name: Open-round unemployment fan is current
        run: python3 forecasts/make_open_fans.py --check

      - name: US LONGBASE baseline table is current
        run: python3 forecasts/make_us_baseline.py --check
