name: Site provenance

# The validation charts are generated from the papers' committed data, and
# make_charts.py --check exists to prove the page has not drifted from it.
# Nothing ran it, so it silently stopped holding: #89 added three hand-authored
# charts and the gate had been failing on main ever since. Run it in CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  charts:
    name: model validation pages match their chart sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Charts are regenerable from committed data
        run: python3 validation/figures/make_charts.py --check
      - name: OLG showcase stats table matches the committed transition data
        run: python3 olg/figures/make_showcase.py --check
      - name: Economy page matches committed data and forecasts
        run: python3 economy/build.py --check
      # The topic pages read data/latest too, and economy/build.py imports
      # topics.py for the series-to-topic map, so the two are regenerated
      # together or not at all.
      - name: Economy topic pages match committed data
        run: python3 economy/topics.py --check
      - name: Data catalogue and release calendar match the committed vintages
        run: python3 data/build_page.py --check
      - name: Homepage hero fan matches the current forecast artifact
        run: python3 assets/make_hero.py --check
      - name: Model-page outlook charts match the current forecast artifact
        run: python3 assets/make_current_outlooks.py --check
      - name: Open-round unemployment fan matches the archived round
        run: python3 forecasts/make_open_fans.py --check
      - name: Generated release notes are indexed
        run: python3 notes/generate_release_notes.py --check
      - name: Global navigation is consistent
        run: python3 site_nav.py
      - name: Public model inventory and evidence are complete
        run: python3 site_contract.py
