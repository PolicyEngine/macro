name: Fetch data vintages

# Pulls the tracked ONS, Bank of England and FRED series, records any outturn
# they complete, rescores the track record, and opens ONE PR when anything
# changed.
# Deliberately a PR and not a direct push: a data revision changes what the site
# claims, so it should be visible as a reviewable diff rather than appearing in
# main overnight. The append-only store means a revision shows up as a new file
# beside the old one, never as an edit.
on:
  schedule:
    # Weekday mornings, after the 07:00 London release window.
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      branch:
        description: "Bot branch to push (must start data/). Use a throwaway name to test a change without touching the open refresh PR."
        type: string
        default: "data/vintage-refresh"
      carry_from:
        description: "Open refresh branch whose stored vintages to keep (default: the push branch)"
        type: string
        default: ""
      open_pr:
        description: "Open or update the PR after pushing (false = push the branch only)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-vintages
  cancel-in-progress: false

env:
  BRANCH: ${{ github.event.inputs.branch || 'data/vintage-refresh' }}
  CARRY_FROM: ${{ github.event.inputs.carry_from || github.event.inputs.branch || 'data/vintage-refresh' }}
  OPEN_PR: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.open_pr }}

jobs:
  fetch:
    name: Fetch, ingest, score and open one PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # A PAT or app token here makes the bot's push start the PR-time
          # workflows (a GITHUB_TOKEN push never does, which is why #195 never
          # had a CI run). Optional: data/refresh.py runs every one of those
          # gates itself before anything is pushed.
          token: ${{ secrets.DATA_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest (for the site test gate)
        run: python3 -m pip install --upgrade pip pytest

      # carry → fetch → notes → ingest → score → fans → pages → gates →
      # append-only. Fails on the first red gate, before anything is pushed;
      # see the module docstring for why each step is here.
      - name: Refresh the store and score the record
        run: python3 data/refresh.py --carry-from "$CARRY_FROM" --summary "$RUNNER_TEMP/summary.md"

      - name: Write the PR body
        run: |
          {
            echo "Automated ONS, Bank of England and FRED refresh from \`data/refresh.py\`"
            echo "(run ${{ github.run_id }}). Outturns, scorecard, notes and pages are"
            echo "regenerated on the same branch, so merging leaves main green."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "New files under \`data/vintages/\` are new vintages — an upstream"
            echo "revision or a new observation. Nothing is edited in place. **An edit"
            echo "to an existing vintage file is a bug**; check the fetcher rather than"
            echo "accepting it."
            echo
            echo "Merging adds the outturns above to the public track record. Check"
            echo "that each one matches the publisher's release before merging."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push the branch and open or update one PR
        env:
          GH_TOKEN: ${{ secrets.DATA_PR_TOKEN || github.token }}
        run: |
          bash .github/scripts/open-bot-pr.sh "$BRANCH" \
            "Refresh official data vintages" "$RUNNER_TEMP/body.md" data
