name: Archive a forecast round before release

# The track record is only evidence once it has scored observations, and it was
# accumulating them at whatever rate someone happened to regenerate the moving
# artifact behind the hero chart — three rounds in three weeks. Nothing tied a
# round to the moment one is actually worth having: immediately before an
# outturn is published.
#
# This ties them together. Every tracked ONS series already carries its
# announced `next_release` in data/latest, so the release calendar decides when
# a round is due. The forecast comes from `forecast_uk` on the deployed MCP
# server — the same boe-svar the site publishes, so the round is the production
# model's answer rather than a second implementation of it, and the job needs
# an MCP client rather than scipy and a VAR package.
#
# Deliberately a PR and not a push. An archived round is append-only and CI
# enforces it, so a bad round cannot be corrected — only superseded — and it
# stays in the denominator of every accuracy statistic forever. A human sees
# the claim before it becomes permanent. `nowcast.py` refuses on its own
# account too: a weak-identification warning, a thin posterior, an already
# archived data edge, or an existing round for today all stop it.

on:
  schedule:
    # Every weekday morning, before the 07:00 London release window. The
    # script exits 1 when nothing is due, so most runs stop in seconds.
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "Archive if a scored series releases within this many days"
        type: string
        default: "3"
      draws:
        description: "Posterior draws (below ~5900 the bands are noise)"
        type: string
        default: "6000"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nowcast-round
  cancel-in-progress: false

jobs:
  round:
    name: Archive a round if a release is due
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Cheap gate: no install, no network beyond the checkout. Most days the
      # job ends here.
      - name: Is a scored release due?
        id: due
        run: |
          if python3 forecasts/nowcast.py --due "${{ github.event.inputs.days || 3 }}"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install an MCP client
        if: steps.due.outputs.due == 'true'
        run: pip install --upgrade pip && pip install "mcp[cli]>=1.9,<2" anyio

      # A cold Modal container plus 6000 draws runs several minutes; the
      # measured time for this call is ~5.5 minutes.
      - name: Generate and archive the round
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 20
        run: |
          python3 forecasts/nowcast.py --draws "${{ github.event.inputs.draws || 6000 }}"

      # Nothing was written when the data edge is unchanged, so there is no PR
      # to open. Detect that rather than opening an empty one.
      - name: Did a round land?
        if: steps.due.outputs.due == 'true'
        id: wrote
        run: |
          if [ -n "$(git status --porcelain forecasts/rounds/)" ]; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrote=false" >> "$GITHUB_OUTPUT"
            echo "no new round — data edge unchanged since the last one"
          fi

      # A new round changes the round count and the page that renders it, so
      # regenerate on the same branch. Without this the merged PR would fail
      # the Site provenance gate on main — the failure mode fetch-vintages.yml
      # already hit in #147.
      - name: Regenerate the scorecard and the pages that read it
        if: steps.wrote.outputs.wrote == 'true'
        run: |
          python3 forecasts/score.py
          python3 forecasts/make_open_fans.py
          python3 forecasts/archive.py --check
          python3 forecasts/score.py --check
          python3 forecasts/make_open_fans.py --check

      - name: Open a PR
        if: steps.wrote.outputs.wrote == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: forecasts/nowcast-round
          title: "Archive a forecast round ahead of the next release"
          commit-message: "Archive a forecast round ahead of the next release"
          body: |
            Automated round from `forecasts/nowcast.py`, generated by
            `forecast_uk` on the hosted MCP server ahead of an announced ONS
            release.

            **Merging this makes a public, permanent claim.** Rounds are
            append-only — CI fails any PR that edits or deletes one — so a
            round that is wrong cannot be corrected, only superseded, and it
            stays in the denominator of every accuracy statistic.

            Check before merging:

            - the round's `data_edge` is the data the model was actually
              allowed to see, and the outturn it will be scored against has
              **not** been published yet
            - `provenance.warnings` is empty and `provenance.ess` is
              comfortably above 100 — the script refuses on the warnings it
              knows about, but read them anyway
            - the diff under `forecasts/rounds/` is an addition only

            The regenerated scorecard and fan charts are on this branch, so
            the provenance gate passes on merge.
