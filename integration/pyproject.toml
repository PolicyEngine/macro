[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyengine-macro"
version = "0.2.0"
description = "PolicyEngine Macro integration layer: unified CLI and MCP server over the OBR macro emulator and the UK SVAR model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
keywords = [
    "economics",
    "macroeconomics",
    "microsimulation",
    "tax-benefit",
    "policy-analysis",
    "forecasting",
    "mcp",
]
# No `license` field and no "License :: OSI Approved :: ..." classifier: the
# licensing decision is deliberately deferred and the repo has no LICENSE file
# on purpose. Do not add one to silence a build warning — ask the maintainer.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8",
    "numpy",
    "pandas",
    # <2: mcp 2.0.0 removed mcp.server.fastmcp, which mcp_server.py builds on.
    "mcp[cli]>=1.0,<2",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://policyengine-macro.vercel.app"
Repository = "https://github.com/PolicyEngine/macro"
Issues = "https://github.com/PolicyEngine/macro/issues"

[project.optional-dependencies]
# Model packages install from GitHub and ship their runtime data. In
# particular, frbus includes model.xml and LONGBASE.TXT inside its wheel, so a
# clean non-editable installation is a supported access path.
models = [
    "obr-macro-model @ git+https://github.com/PolicyEngine/obr-macroeconomic-model@85ada9be070a34a4a4a0a65d92f8f148a476ccb1",
    "boe_var @ git+https://github.com/PolicyEngine/boe-var-model@3ab56259224c20a0bf65caa523e6e7440e56b37e",
    "frbus @ git+https://github.com/PolicyEngine/us-frb-model@ca80394c99e9aeae410723ef3f51b9fdf9b84a77",
    "us-hank-model @ git+https://github.com/PolicyEngine/us-hank-model@b9b3130d47d02edd07668531dfb4fce54f241b9b",
    # [models] pulls the pinned policyengine-uk / policyengine-us country
    # packages that pe.uk / pe.us need at runtime.
    "policyengine[models]>=4,<5",
    # policyengine's bundled data-release manifest certifies an exact
    # policyengine-us version; anything newer fails certification at import
    # (every pe.* call raises). Keep in sync with the manifest pin.
    "policyengine-us==1.764.6",
]

[project.scripts]
pe-macro = "policyengine_macro.cli:main"
# Legacy alias kept for existing docs/users.
policyengine-macro = "policyengine_macro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: runs a model estimation/solve (seconds to a minute)"]
