[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyengine-macro"
version = "0.2.0"
description = "PolicyEngine Macro integration layer: unified CLI and MCP server over the OBR macro emulator and the UK SVAR model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
keywords = [
    "economics",
    "macroeconomics",
    "microsimulation",
    "tax-benefit",
    "policy-analysis",
    "forecasting",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8",
    "numpy",
    "pandas",
    # <2: mcp 2.0.0 removed mcp.server.fastmcp, which mcp_server.py builds on.
    "mcp[cli]>=1.0,<2",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://policyengine-macro.vercel.app"
Repository = "https://github.com/PolicyEngine/macro"
Issues = "https://github.com/PolicyEngine/macro/issues"

[project.optional-dependencies]
# Model packages install from GitHub and ship their runtime data. In
# particular, frbus includes model.xml and LONGBASE.TXT inside its wheel, so a
# clean non-editable installation is a supported access path.
models = [
    "obr-macro-model @ git+https://github.com/PolicyEngine/obr-macroeconomic-model@1ed742c78ab6480e1698b54202e84539ee448ce5",
    "boe_var @ git+https://github.com/PolicyEngine/boe-var-model@42cbcbb728b55b3f416764568fa8f3aef68a6730",
    "frbus @ git+https://github.com/PolicyEngine/us-frb-model@2508a2d3ee7d078fd82f38bc17567e4433489913",
    "us-hank-model @ git+https://github.com/PolicyEngine/us-hank-model@19a8e5e5cd8e7120fbbd2e3de3c5b63509824f3c",
    # policyengine (".py") with its [models] extra, which pins the country
    # packages that pe.uk / pe.us run. policyengine 6.x needs Python >= 3.11.
    "policyengine[models]==6.11.1",
    # The country packages policyengine 6.11.1's [models] extra pins, listed
    # explicitly so that bumping policyengine alone fails to resolve instead
    # of silently changing the models. policyengine's bundled data-release
    # manifest certifies the US and UK microdata for exactly these versions;
    # with any other policyengine-us, `import policyengine` fails
    # certification and every pe.* call (UK included) raises. Change all
    # three together, and keep them equal to integration/modal_app.py.
    "policyengine-us==2.2.1",
    "policyengine-uk==2.151.0",
    "policyengine-core==3.33.3",
]

[project.scripts]
pe-macro = "policyengine_macro.cli:main"
# Legacy alias kept for existing docs/users.
policyengine-macro = "policyengine_macro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: runs a model estimation/solve (seconds to a minute)"]
